<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оценка автомобиля</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Оценка автомобиля</h1>
    <p>Укажите модель, год выпуска и пробег.</p>

    <h2>Рассчитать стоимость</h2>
    <form id="valuation-form">
      <label>Модель<br><select name="model_id" id="model" required><option value="">Загрузка...</option></select></label>
      <label>Год выпуска<br><input name="year" id="year" type="number" min="1980" required></label>
      <label>Пробег, км<br><input name="mileage_km" type="number" min="0" max="1000000" value="60000" required></label>
      <button type="submit">Оценить авто</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>

    <h2>История оценок</h2>
    <button type="button" id="show-history">Показать историю</button>
    <p id="message" role="status" aria-live="polite"></p>
    <div id="history"></div>

  </main>
</body>
</html>
