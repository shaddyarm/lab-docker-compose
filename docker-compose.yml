services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: car_value
      POSTGRES_USER: car_user
      POSTGRES_PASSWORD: car_demo_password
    volumes:
      - car_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_user -d car_value"]
      interval: 5s
      timeout: 3s
      retries: 10

  web-service:
    build: ./web-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: car_value
      DB_USER: car_user
      DB_PASSWORD: car_demo_password
      VALUATION_SERVICE_URL: http://web-service:8001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  car_data:
